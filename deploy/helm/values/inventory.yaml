serviceName: inventory
existingSecret: inventory-secrets

serviceAccount:
  roleArn: ""

migrate:
  enabled: true
  image: inventory-migrate
  args: ["up"]

env:
  SERVICE_NAME: inventory-service
  ENVIRONMENT: production
  HTTP_ADDR: ":8080"
  AUTH_ENABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

workloads:
  - name: api
    image: inventory-api
    port: 8080
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
