serviceName: order
existingSecret: order-secrets

serviceAccount:
  roleArn: ""  # set to the IRSA role ARN from Terraform

migrate:
  enabled: true
  image: order-migrate
  args: ["up"]

env:
  SERVICE_NAME: order-service
  ENVIRONMENT: production
  HTTP_ADDR: ":8080"
  AUTH_ENABLED: "false"
  KAFKA_BROKERS: "REPLACE_WITH_MSK_BOOTSTRAP"
  SAGA_GROUP_ID: order-saga
  SAGA_TOPICS: orders.events
  PROJECTOR_GROUP_ID: order-projection
  PROJECTOR_TOPICS: orders.events
  RELAY_POLL_INTERVAL: 1s
  RELAY_BATCH_SIZE: "100"
  INVENTORY_BASE_URL: http://inventory-api:8080
  PAYMENT_BASE_URL: http://payment-api:8080
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  METRICS_ADDR: ":9090"

ingress:
  enabled: true
  className: alb
  serviceName: api
  servicePort: 8080
  host: ""  # set to your DNS name
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /livez

metrics:
  enabled: true

workloads:
  - name: api
    image: order-api
    port: 8080
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
  - name: relay
    image: order-relay
    port: 9090
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
  - name: projector
    image: order-projector
    port: 9090
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
  - name: orchestrator
    image: order-orchestrator
    port: 9090
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
