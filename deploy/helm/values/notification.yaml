serviceName: notification
existingSecret: notification-secrets

serviceAccount:
  roleArn: ""

migrate:
  enabled: true
  image: notification-migrate
  args: ["up"]

env:
  SERVICE_NAME: notification-service
  ENVIRONMENT: production
  KAFKA_BROKERS: "REPLACE_WITH_MSK_BOOTSTRAP"
  CONSUMER_GROUP_ID: notification
  CONSUMER_TOPICS: orders.events,payments.events,fulfillment.events
  METRICS_ADDR: ":9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

metrics:
  enabled: true

workloads:
  - name: consumer
    image: notification-consumer
    port: 9090
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
