serviceName: fulfillment
existingSecret: fulfillment-secrets

serviceAccount:
  roleArn: ""

migrate:
  enabled: true
  image: fulfillment-migrate
  args: ["up"]

env:
  SERVICE_NAME: fulfillment-service
  ENVIRONMENT: production
  HTTP_ADDR: ":8080"
  AUTH_ENABLED: "false"
  KAFKA_BROKERS: "REPLACE_WITH_MSK_BOOTSTRAP"
  CONSUMER_GROUP_ID: fulfillment
  CONSUMER_TOPICS: orders.events
  FULFILLMENT_EVENTS_TOPIC: fulfillment.events
  METRICS_ADDR: ":9090"
  DEAD_LETTER_TOPIC: dead-letter
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318

metrics:
  enabled: true

workloads:
  - name: api
    image: fulfillment-api
    port: 8080
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
  - name: consumer
    image: fulfillment-consumer
    port: 9090
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
