apiVersion: v1
kind: Namespace
metadata:
  name: order-fulfillment
  labels:
    app.kubernetes.io/part-of: order-fulfillment
    # Enforce the restricted Pod Security Standard. Every workload in this
    # namespace runs nonroot, drops all capabilities, forbids privilege
    # escalation, mounts a read-only root filesystem, and sets a seccomp
    # profile, so it satisfies restricted without exception.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
