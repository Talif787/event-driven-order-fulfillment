services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # One-shot topic provisioning. Creating orders.events up front (rather than
  # relying on lazy auto-creation by the first producer) removes the cold-start
  # race where the projector joins its consumer group before the topic exists
  # and then sits idle. It also lets us pick the partition count deliberately.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic orders.events \
          --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic fulfillment.events \
          --partitions 3 --replication-factor 1
    restart: "no"

  migrate:
    build:
      context: ./services/order
      target: migrate
    environment:
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./services/order
      target: api
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
      AUTH_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  relay:
    build:
      context: ./services/order
      target: relay
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      RELAY_POLL_INTERVAL: 1s
      RELAY_BATCH_SIZE: "100"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  projector:
    build:
      context: ./services/order
      target: projector
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      PROJECTOR_GROUP_ID: order-projection
      PROJECTOR_TOPICS: orders.events
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  orchestrator:
    build:
      context: ./services/order
      target: orchestrator
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      SAGA_GROUP_ID: order-saga
      SAGA_TOPICS: orders.events
      INVENTORY_BASE_URL: http://inventory-api:8080
      # With PAYMENT_BASE_URL set the saga calls the real Payment service and
      # ignores PAYMENT_STUB_OUTCOME (kept only as a fallback if the URL is empty).
      PAYMENT_BASE_URL: http://payment-api:8080
      PAYMENT_STUB_OUTCOME: approve
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory-api:
        condition: service_started
      payment-api:
        condition: service_started
    restart: on-failure
  # ---------------------------------------------------------------------------
  # Inventory service (Phase 3). Own Postgres instance: database per service.
  # ---------------------------------------------------------------------------
  inventory-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - inventory-pgdata:/var/lib/postgresql/data

  inventory-migrate:
    build:
      context: ./services/inventory
      target: migrate
    environment:
      DATABASE_URL: postgres://inventory:inventory@inventory-postgres:5432/inventory?sslmode=disable
    command: ["up"]
    depends_on:
      inventory-postgres:
        condition: service_healthy
    restart: "no"

  inventory-api:
    build:
      context: ./services/inventory
      target: api
    environment:
      SERVICE_NAME: inventory-service
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://inventory:inventory@inventory-postgres:5432/inventory?sslmode=disable
      AUTH_ENABLED: "false"
    ports:
      - "8081:8080"
    depends_on:
      inventory-postgres:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Payment service (Phase 4). Java/Spring Boot, own Postgres, runs on :8082.
  # Spring runs Flyway on startup, so there is no separate migrate service.
  # ---------------------------------------------------------------------------
  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payment-pgdata:/var/lib/postgresql/data

  payment-api:
    build:
      context: ./services/payment
      target: api
    environment:
      DATABASE_URL: jdbc:postgresql://payment-postgres:5432/payment
      DATABASE_USER: payment
      DATABASE_PASSWORD: payment
      KAFKA_BROKERS: kafka:9092
      SERVER_PORT: "8080"
      PAYMENT_GATEWAY_OUTCOME: ${PAYMENT_GATEWAY_OUTCOME:-approve}
      PAYMENT_WEBHOOK_SECRET: whsec_local_dev_secret
    ports:
      - "8082:8080"
    depends_on:
      payment-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Fulfillment service (Phase 5). Go, own Postgres on :5435, HTTP API on :8083.
  # The consumer reacts to order.confirmed and opens a shipment; the API advances
  # it (dispatch, deliver) and both emit to fulfillment.events.
  # ---------------------------------------------------------------------------
  fulfillment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
      POSTGRES_DB: fulfillment
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - fulfillment-pgdata:/var/lib/postgresql/data

  fulfillment-migrate:
    build:
      context: ./services/fulfillment
      target: migrate
    environment:
      DATABASE_URL: postgres://fulfillment:fulfillment@fulfillment-postgres:5432/fulfillment?sslmode=disable
    command: ["up"]
    depends_on:
      fulfillment-postgres:
        condition: service_healthy
    restart: "no"

  fulfillment-api:
    build:
      context: ./services/fulfillment
      target: api
    environment:
      SERVICE_NAME: fulfillment-service
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://fulfillment:fulfillment@fulfillment-postgres:5432/fulfillment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      FULFILLMENT_EVENTS_TOPIC: fulfillment.events
      AUTH_ENABLED: "false"
    ports:
      - "8083:8080"
    depends_on:
      fulfillment-postgres:
        condition: service_healthy
      fulfillment-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

  fulfillment-consumer:
    build:
      context: ./services/fulfillment
      target: consumer
    environment:
      SERVICE_NAME: fulfillment-service
      ENVIRONMENT: development
      DATABASE_URL: postgres://fulfillment:fulfillment@fulfillment-postgres:5432/fulfillment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONSUMER_GROUP_ID: fulfillment
      CONSUMER_TOPICS: orders.events
      FULFILLMENT_EVENTS_TOPIC: fulfillment.events
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      fulfillment-postgres:
        condition: service_healthy
      fulfillment-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  pgdata:
  inventory-pgdata:
  payment-pgdata:
  fulfillment-pgdata:
