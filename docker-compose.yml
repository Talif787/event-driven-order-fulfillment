services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ./services/order
      target: migrate
    environment:
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./services/order
      target: api
    environment:
      SERVICE_NAME: order-service
      ENVIRONMENT: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://order:order@postgres:5432/order?sslmode=disable
      AUTH_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  pgdata:
