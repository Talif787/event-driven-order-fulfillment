openapi: 3.1.0
info:
  title: Order Service API
  version: 1.0.0
  description: >
    Order intake and read API for the Event-Driven E-Commerce Order and
    Fulfillment System. Placement is asynchronous: a successful response
    acknowledges acceptance, and the order proceeds through reservation,
    payment, and fulfillment in later pipeline stages.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /v1/orders:
    post:
      summary: Place an order
      operationId: placeOrder
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key that makes retried submissions safe.
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '202':
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orders/{id}:
    get:
      summary: Get an order by id
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        '200':
          description: Process is live
  /readyz:
    get:
      summary: Readiness probe
      operationId: readyz
      security: []
      responses:
        '200':
          description: Ready to serve traffic
        '503':
          description: A dependency is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlaceOrderRequest:
      type: object
      required: [items, shipTo]
      properties:
        customerId:
          type: string
          format: uuid
          description: Used only when authentication is disabled; otherwise taken from the token subject.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineItem'
        shipTo:
          $ref: '#/components/schemas/Address'
    LineItem:
      type: object
      required: [sku, quantity, unitPriceMinor, currency]
      properties:
        sku:
          type: string
          maxLength: 64
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        unitPriceMinor:
          type: integer
          format: int64
          minimum: 0
          description: Price in minor currency units (for example cents).
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Address:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country:
          type: string
          minLength: 2
          maxLength: 2
    PlaceOrderResponse:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
    OrderResponse:
      type: object
      properties:
        orderId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, CANCELLED] }
        totalMinor: { type: integer, format: int64 }
        currency: { type: string }
        version: { type: integer, format: int64 }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
