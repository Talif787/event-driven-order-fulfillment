spring:
  application:
    name: payment-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/payment}
    username: ${DATABASE_USER:payment}
    password: ${DATABASE_PASSWORD:payment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: payment

payment:
  events-topic: ${PAYMENT_EVENTS_TOPIC:payments.events}
  # Simulated PSP. "approve" captures, "decline" declines. A per-request
  # override header (X-Force-Outcome) takes precedence for demos and tests.
  gateway:
    default-outcome: ${PAYMENT_GATEWAY_OUTCOME:approve}
  webhook:
    # Shared secret for HMAC-SHA256 signature verification of inbound webhooks.
    secret: ${PAYMENT_WEBHOOK_SECRET:whsec_local_dev_secret}
  reconciliation:
    # A captured payment with no settlement webhook after this age is swept.
    stale-after: ${PAYMENT_RECONCILE_STALE_AFTER:PT2M}
    poll-interval-ms: ${PAYMENT_RECONCILE_INTERVAL_MS:30000}

logging:
  level:
    root: INFO
    com.orderfulfillment.payment: INFO
