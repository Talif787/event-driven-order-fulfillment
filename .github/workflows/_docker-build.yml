name: docker-build

# Reusable workflow: builds and pushes every image target for one service to
# GHCR, keyed by the commit SHA and also tagged latest. Called by release.yml
# once per changed service.
on:
  workflow_call:
    inputs:
      service:
        description: Service directory under services/.
        type: string
        required: true
      targets:
        description: JSON array of Dockerfile targets to build for this service.
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Registry metadata
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/order-fulfillment" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ inputs.service }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.meta.outputs.registry }}/${{ inputs.service }}-${{ matrix.target }}:${{ github.sha }}
            ${{ steps.meta.outputs.registry }}/${{ inputs.service }}-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
